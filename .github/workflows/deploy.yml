name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: appointa-812ad

  deploy-backend:
    name: Deploy Backend (SSH + PM2)
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.SERVER_PATH }}

            echo "--- git pull ---"
            git pull

            echo "--- backend: install deps ---"
            cd backend
            ~/.local/bin/poetry install --without dev

            echo "--- backend: migrations ---"
            ~/.local/bin/poetry run alembic upgrade head

            echo "--- backend: pm2 restart ---"
            pm2 describe appointa-back > /dev/null 2>&1 \
              && pm2 restart appointa-back \
              || pm2 start "~/.local/bin/poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000" \
                   --name appointa-back \
                   --cwd ${{ secrets.SERVER_PATH }}/backend

            echo "--- whatsapp: install deps ---"
            cd ${{ secrets.SERVER_PATH }}/whatsapp-service
            npm install --production

            echo "--- whatsapp: pm2 restart ---"
            pm2 describe appointa-whatsapp > /dev/null 2>&1 \
              && pm2 restart appointa-whatsapp \
              || pm2 start server.js \
                   --name appointa-whatsapp \
                   --cwd ${{ secrets.SERVER_PATH }}/whatsapp-service

            pm2 save
            echo "Deploy exitoso - $(date)"
          ENDSSH
